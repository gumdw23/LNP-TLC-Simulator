name: LNP V1.00 V3UX Windows QA

on:
  push:
    branches:
      - lnp-v100-v3ux-qa-20260905

jobs:
  windows-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Windows runner
        shell: pwsh
        run: |
          Write-Host "LNP QA Windows runner available"
          python --version
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
